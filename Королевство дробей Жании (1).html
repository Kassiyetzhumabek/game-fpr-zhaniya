<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Королевство дробей Жании</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#E6D5B8; --kraft-2:#DCC7A4; --page:#FBF5EA; --page-2:#F4EAD7;
  --ink:#4A2E1F; --ink-2:#6B4A35; --muted:#8C7058; --line:#D8C3A1;
  --wood:#8A5A3B; --wood-d:#5E3B25;
  --berry:#8E3B4E; --moss:#5E6B3A; --slate:#4F6D7A; --mustard:#B88A2A;
  --ok-bg:#E5EAD2; --ok-ink:#3E4A22; --bad-bg:#F2DCDD; --bad-ink:#7A2436; --info-bg:#F3E5C3; --info-ink:#6B4E12;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'PT Sans',system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.5;
  background-color:var(--kraft);
  background-image:radial-gradient(rgba(94,59,37,.07) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
h1,h2,h3,h4{font-family:'Neucha','PT Sans',cursive;font-weight:400;letter-spacing:.01em;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 30px}

/* header */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 4px 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.brand svg{flex:none}
.brand h1{font-size:38px;line-height:1}
.brand span{display:block;font-size:15px;color:var(--ink-2);margin-top:2px}
.counters{display:flex;gap:22px;font-size:16px;color:var(--ink-2)}
.counters b{font-family:'Neucha',cursive;font-size:24px;color:var(--ink);font-weight:400;margin-left:4px}

/* home: shelves */
.greet{display:flex;gap:18px;align-items:flex-start;margin:22px 0 6px;flex-wrap:wrap}
.greet h2{font-size:34px}
.greet p{margin:4px 0 0;max-width:620px;color:var(--ink-2)}
.continue{margin-left:auto;background:var(--page);border:2px solid var(--ink);border-radius:10px;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);font-size:16px;text-align:left}
.continue small{display:block;color:var(--muted)}
.continue strong{font-family:'Neucha',cursive;font-weight:400;font-size:22px}
.shelf-wrap{margin-top:26px}
.shelf-wrap h3{font-size:24px;margin:0 0 4px 6px;color:var(--ink-2)}
.shelf{display:flex;align-items:flex-end;gap:8px;padding:18px 14px 0;min-height:250px;position:relative}
.plank{height:18px;background:linear-gradient(var(--wood),var(--wood-d));border-radius:3px;box-shadow:0 6px 0 rgba(74,46,31,.25)}
.spine{position:relative;flex:1;max-width:150px;min-width:0;border:none;border-radius:5px 5px 2px 2px;color:#FBF5EA;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  box-shadow:inset -10px 0 0 rgba(0,0,0,.13),inset 3px 0 0 rgba(255,255,255,.12);transition:transform .15s ease}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine .no{font-family:'Neucha',cursive;font-size:20px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(251,245,234,.7);display:flex;align-items:center;justify-content:center}
.spine .ttl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Neucha',cursive;font-size:22px;line-height:1.05;flex:1;display:flex;align-items:center;margin:10px 0;text-align:center}
.spine .who{font-size:12.5px;opacity:.9;text-align:center;line-height:1.15}
.spine .marks{margin-top:6px;display:flex;gap:3px}
.spine .marks i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(251,245,234,.85)}
.spine .marks i.on{background:#F2D27A;border-color:#F2D27A}
.shelf .gap{flex:1}
.shelf .deco{width:46px;height:120px;align-self:flex-end;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px),var(--kraft-2);transform:rotate(-8deg);transform-origin:bottom left;border:1px solid var(--line)}

/* module page */
.back{background:none;border:none;font-size:16px;padding:14px 0 6px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.book{background:var(--page);border:2px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 rgba(74,46,31,.85);padding:26px 28px 28px;position:relative;margin-top:6px}
.ribbon{position:absolute;top:-2px;right:34px;width:34px;height:70px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.mhead{display:flex;gap:16px;align-items:center;padding-right:60px}
.mhead .badge{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FBF5EA;font-family:'Neucha',cursive;font-size:26px}
.mhead h2{font-size:34px;line-height:1.05}
.mhead .who{color:var(--muted);font-size:16px}
.story{margin:16px 0 10px;padding:12px 16px;border-left:4px solid;background:var(--page-2);font-style:italic;max-width:760px}
.tabs{display:flex;gap:0;margin:18px 0 12px;border-bottom:2px solid var(--line)}
.tab{border:none;background:none;padding:8px 18px 10px;font-family:'Neucha',cursive;font-size:22px;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--ink)}
.lesson p{margin:10px 0;max-width:760px}
.rule{padding:12px 16px;margin:14px 0;border:2px dashed;border-radius:10px;background:#fff9ef;max-width:780px}
.demo{background:var(--page-2);border-radius:12px;padding:16px 18px;margin:16px 0;border:1.5px solid var(--line)}
.demo h4{font-size:22px;margin-bottom:8px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.ctrl label{min-width:190px;font-weight:700;font-size:16px}
input[type=range]{width:200px;accent-color:var(--wood)}
.btn{border:2px solid var(--ink);border-radius:9px;padding:10px 20px;font-weight:700;font-size:17px;color:#FBF5EA;background:var(--wood);box-shadow:0 3px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.light{background:var(--page);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:6px 14px;font-size:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:700;line-height:1.05;margin:0 3px}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px}
.fr>span{padding:0 4px}
.fr.one>span{border:none!important}
.mx{display:inline-flex;align-items:center;vertical-align:middle;font-weight:700}
.mx>b{font-size:1.35em;margin-right:1px}
.fbig{font-size:32px}
.fin{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;gap:4px;margin:0 4px}
.fin input,.numin,.whole{width:62px;height:46px;border-radius:8px;border:2px solid var(--line);background:#fff;text-align:center;font-size:24px;font-weight:700;outline:none}
.whole{height:58px;width:62px;font-size:30px}
.fin input:focus,.numin:focus,.whole:focus{border-color:var(--ink)}
.fin .bar{width:70px;height:3px;background:var(--ink);border-radius:2px}
.prompt{font-size:21px;line-height:1.45;margin:6px 0 14px;max-width:780px}
.eq{font-size:26px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:12px 0}
.choices{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.choice{min-width:78px;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:10px 18px;font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.choice:hover:not(:disabled){background:#fff6e6}
.choice.right{background:var(--ok-bg)} .choice.wrong{background:var(--bad-bg)}
.fb{border-radius:10px;padding:12px 16px;margin-top:14px;display:none;max-width:780px;position:relative}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok-ink)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad-ink)}
.fb.info{display:block;background:var(--info-bg);color:var(--info-ink)}
.stamp{position:absolute;right:14px;top:-18px;transform:rotate(-9deg);border:3px solid var(--moss);color:var(--moss);background:var(--page);font-family:'Neucha',cursive;font-size:22px;padding:2px 12px;border-radius:8px;animation:stamp .35s ease-out}
@keyframes stamp{0%{transform:rotate(-9deg) scale(1.8);opacity:0}100%{transform:rotate(-9deg) scale(1);opacity:1}}
.progress{display:flex;gap:5px;margin:4px 0 10px}
.progress i{flex:1;max-width:40px;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--moss)} .progress i.bad{background:var(--berry)} .progress i.cur{background:var(--mustard)}
.counter{color:var(--muted);font-size:16px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* order game */
.mini-books{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.mbook{border:2px solid var(--ink);border-radius:6px 6px 3px 3px;width:84px;height:120px;color:#FBF5EA;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:inset -8px 0 0 rgba(0,0,0,.14)}
.mbook.used{opacity:.2;cursor:default}
.mshelf{min-height:76px;border-bottom:12px solid var(--wood);display:flex;gap:10px;align-items:flex-end;padding:6px;flex-wrap:wrap;max-width:600px}
.mshelf .fr{font-size:22px;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:4px 6px}
/* pairs */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:640px;margin:14px 0}
.card{height:96px;border:2px solid var(--ink);background:#fff;border-radius:10px;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line)}
.card.sel{background:var(--info-bg)}
.card.done{background:var(--ok-bg);opacity:.75;cursor:default}
/* steps */
.step{border-radius:10px;padding:12px 14px;margin:10px 0;border:2px dashed var(--line);opacity:.5;max-width:780px}
.step.on{opacity:1;border:2px solid var(--slate);background:#fff}
.step.done{opacity:1;border:2px solid var(--moss);background:var(--ok-bg)}
.step h4{font-size:21px;margin-bottom:4px}
/* line, pies */
svg .hit{cursor:pointer}
svg .hit:hover+.tickv{opacity:1}
.result{text-align:center;padding:16px 10px}
.result h2{font-size:36px;margin:6px 0}
.seal{display:inline-flex;gap:10px;margin:10px 0}
.seal span{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Neucha',cursive;font-size:26px;color:var(--line)}
.seal span.on{border-color:var(--mustard);background:#F6E7B8;color:var(--wood-d)}
.timer{font-family:'Neucha',cursive;font-size:56px;line-height:1}
.particle{position:fixed;pointer-events:none;z-index:50;width:10px;height:10px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}
footer{margin-top:34px;padding-top:12px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--ink-2)}
footer a{color:var(--ink);font-weight:700}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
.kpi{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.kpi .v{font-family:'Neucha',cursive;font-size:30px;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:700}
.book h3{font-size:26px;margin:24px 0 8px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0;border-bottom:1.5px solid var(--ink-2)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.chart .b{width:56%;max-width:44px;background:var(--wood);border-radius:4px 4px 0 0}
.chart .col:hover .b{background:var(--wood-d)}
.chart .val{font-size:13px;font-weight:700;margin-bottom:3px}
.tip{position:absolute;bottom:100%;background:var(--ink);color:#FBF5EA;font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;margin-bottom:4px;z-index:3}
.chart .col:hover .tip{display:block}
.xl{display:flex;gap:10px;padding:4px}
.xl div{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.note{font-size:15px;background:var(--info-bg);border-radius:8px;padding:10px 14px;margin:10px 0;max-width:780px}
@media (max-width:640px){.brand h1{font-size:30px}.book{padding:20px 16px}.mhead h2{font-size:27px}.spine{width:68px}.spine .ttl{font-size:18px}.shelf{gap:5px;padding:14px 6px 0}.shelf .deco{display:none}.prompt{font-size:19px}.ctrl label{min-width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="На главную">
      <svg width="54" height="46" viewBox="0 0 54 46" aria-hidden="true"><path d="M5 38 L3 12 L16 24 L27 5 L38 24 L51 12 L49 38 Z" fill="#B88A2A" stroke="#4A2E1F" stroke-width="2.5" stroke-linejoin="round"/><rect x="5" y="38" width="44" height="6" rx="2" fill="#8E3B4E" stroke="#4A2E1F" stroke-width="2.5"/><circle cx="27" cy="27" r="3.5" fill="#8E3B4E"/><circle cx="16" cy="31" r="2.5" fill="#4F6D7A"/><circle cx="38" cy="31" r="2.5" fill="#5E6B3A"/></svg>
      <div><h1>Королевство дробей</h1><span>учебная книга принцессы Жании</span></div>
    </button>
    <div class="counters"><div>Сегодня<b id="todayTime">0 мин</b></div><div>Печати<b id="starCount">0 из 33</b></div></div>
  </header>
  <main id="app"></main>
  <footer><span id="syncNote">Прогресс сохраняется</span><a href="#report">Отчёт для учителя</a></footer>
</div>

<script>
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const app=$('#app');
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const simp=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]};
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function F(n,d,color){ if(d===1) return `<span class="fr one" style="${color?'color:'+color:''}"><span>${n}</span></span>`;
  return `<span class="fr" style="${color?'color:'+color:''}"><span>${n}</span><span>${d}</span></span>`; }
function M(w,n,d,color){ if(!n) return `<span class="mx" style="${color?'color:'+color:''}"><b>${w}</b></span>`; if(!w) return F(n,d,color);
  return `<span class="mx" style="${color?'color:'+color:''}"><b>${w}</b>${F(n,d)}</span>`; }
function toMixed(n,d){ const [a,b]=simp(n,d); return [Math.floor(a/b), a%b, b]; }
function MV(n,d,color){ const [w,r,b]=toMixed(n,d); return M(w,r,b,color); }  // value n/d shown as mixed
function fmtDur(sec){sec=Math.round(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h)return `${h} ч ${String(m).padStart(2,'0')} мин`; if(m)return `${m} мин${s&&m<10?' '+s+' с':''}`; return `${s} с`}
const PRAISE=['Верно, Жания!','Точно в цель!','Так держать!','Безупречно!','Правильно!','Отлично решено!'];
const RETRY=['Почти. Попробуй ещё раз.','Не совсем — проверь вычисления.','Ещё одна попытка, ты справишься.'];
const STAMPS=['Верно','Отлично','Умница','Браво'];

function pieSVG(n,d,size=150,color='#8E3B4E',opts={}){
  const r=size/2-4,c=size/2; let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="круг, закрашено ${n} из ${d}">`;
  if(d===1){ s+=`<circle class="${opts.click?'hit':''}" data-i="0" cx="${c}" cy="${c}" r="${r}" fill="${(opts.filled?opts.filled[0]:n)?color:'#fff'}" stroke="#4A2E1F" stroke-width="2"/>`; return s+'</svg>'; }
  for(let i=0;i<d;i++){ const a0=(-90+360*i/d)*Math.PI/180,a1=(-90+360*(i+1)/d)*Math.PI/180;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    const fill=(opts.filled?opts.filled[i]:i<n)?color:'#fff';
    s+=`<path class="${opts.click?'hit':''}" data-i="${i}" d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${360/d>180?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#4A2E1F" stroke-width="2"/>`; }
  return s+'</svg>';
}
function barSVG(n,d,w=300,h=34,color='#8E3B4E',extra){
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;display:block">`; const cw=(w-4)/d;
  for(let i=0;i<d;i++){ let f='#fff'; if(extra&&i>=n&&i<n+extra.n)f=extra.color; else if(i<n)f=color;
    s+=`<rect x="${2+i*cw}" y="2" width="${cw}" height="${h-4}" fill="${f}" stroke="#4A2E1F" stroke-width="1.5"/>`; }
  return s+'</svg>';
}
/* area grid: cols d1 with n1 shaded (vertical), rows d2 with n2 shaded */
function gridSVG(n1,d1,n2,d2,size=220,c1='#B88A2A',c2='#4F6D7A'){
  const cw=(size-4)/d1, ch=(size-4)/d2; let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for(let i=0;i<d1;i++)for(let j=0;j<d2;j++){ const a=i<n1,b=j<n2; const f=a&&b?'#8E3B4E':a?'#EBD8A8':b?'#C9D7DD':'#fff';
    s+=`<rect x="${2+i*cw}" y="${2+j*ch}" width="${cw}" height="${ch}" fill="${f}" stroke="#4A2E1F" stroke-width="1.2"/>`; }
  return s+`<rect x="2" y="2" width="${size-4}" height="${size-4}" fill="none" stroke="#4A2E1F" stroke-width="2.5"/></svg>`;
}

/* ---------- tracking ---------- */
const LS_KEY='zhaniya_fractions_v2';
let local={stars:{},best:{},sessions:[],last:null};
try{const raw=localStorage.getItem(LS_KEY); if(raw) local=Object.assign(local,JSON.parse(raw));}catch(e){}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(local))}catch(e){}}
const SID=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const session={sid:SID,startedAt:Date.now(),lastAt:Date.now(),activeSec:0,correct:0,wrong:0,modules:{},mistakes:[],ballBest:0,stars:{}};
let currentModule='home',lastActivity=Date.now(),tracking=true,dirty=false,writing=false,savedSec=0,db=null,remoteSessions=[];
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,()=>lastActivity=Date.now(),{passive:true}));
let mmT=0; addEventListener('mousemove',()=>{const t=Date.now(); if(t-mmT>3000){mmT=t;lastActivity=t}},{passive:true});
function modStat(id){return session.modules[id]||(session.modules[id]={sec:0,correct:0,wrong:0})}
setInterval(()=>{
  if(!tracking||document.visibilityState!=='visible')return;
  if(Date.now()-lastActivity>90000)return;
  session.activeSec++; session.lastAt=Date.now(); if(currentModule!=='home')modStat(currentModule).sec++;
  dirty=true; if(session.activeSec%5===0)updateHeader(); if(session.activeSec-savedSec>=60)saveNow();
},1000);

async function saveNow(){
  if(!dirty)return; if(session.activeSec<15&&session.correct+session.wrong===0)return;
  const d=sessionDoc(); const i=local.sessions.findIndex(s=>s.sid===SID); if(i>=0)local.sessions[i]=d; else local.sessions.push(d);

/* number line: max integer, step 1/d */
function lineSVG(max,d,opt={}){
  const W=620,pad=26,y=46,len=W-2*pad,steps=max*d,sx=len/steps;
  let s=`<svg viewBox="0 0 ${W} ${opt.points?110:84}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="числовой луч">`;
  s+=`<line x1="${pad}" y1="${y}" x2="${W-pad+12}" y2="${y}" stroke="#4A2E1F" stroke-width="2.5"/><path d="M${W-pad+12} ${y} l-10 -6 v12z" fill="#4A2E1F"/>`;
  for(let i=0;i<=steps;i++){const x=pad+i*sx,major=i%d===0;s+=`<line x1="${x}" y1="${y-(major?12:7)}" x2="${x}" y2="${y+(major?12:7)}" stroke="#4A2E1F" stroke-width="${major?2.5:1.5}"/>`;
    if(major)s+=`<text x="${x}" y="${y+32}" text-anchor="middle" font-size="18" font-weight="700" fill="#4A2E1F" font-family="PT Sans">${i/d}</text>`;
    if(opt.click)s+=`<rect class="hit" data-i="${i}" x="${x-sx/2}" y="${y-26}" width="${sx}" height="52" fill="transparent"/>`;}
  if(opt.marker!=null){const x=pad+opt.marker*sx;s+=`<circle cx="${x}" cy="${y}" r="9" fill="${opt.color||'#8E3B4E'}" stroke="#4A2E1F" stroke-width="2" pointer-events="none"/>`}
  if(opt.points)opt.points.forEach((p,k)=>{const x=pad+p.v*max*0+p.v*len/max;s+=`<circle cx="${x}" cy="${y}" r="8" fill="${opt.color}" stroke="#4A2E1F" stroke-width="2"/><foreignObject x="${x-22}" y="${y-62+(k%2)*0}" width="44" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:15px">${p.label}</div></foreignObject>`});
  return s+'</svg>';
}

/* ---------- practice engine ---------- */
function startPractice(el,m){
  const N=COUNT[m.id];let i=0,firstOk=0;const res=[];
  const draw=()=>{ if(i>=N)return finish(); const t=GEN[m.id](i);
    el.innerHTML=`<div class="progress">${Array.from({length:N},(_,k)=>`<i class="${k<i?(res[k]?'ok':'bad'):k===i?'cur':''}"></i>`).join('')}</div>
      <div class="counter">Задание ${i+1} из ${N}</div><div id="task"></div>`;
    renderTask($('#task',el),t,m,ok=>{res[i]=ok;if(ok)firstOk++;i++;draw()}); };
  const finish=()=>{ const r=firstOk/N,s=r>=.9?3:r>=.7?2:r>=.4?1:0;
    if(s>(local.stars[m.id]||0)){local.stars[m.id]=s;saveLocal()} if(s>(session.stars[m.id]||0))session.stars[m.id]=s;
    dirty=true;saveNow();updateHeader();if(s>=2)burst();
    el.innerHTML=`<div class="result"><div class="seal">${[0,1,2].map(k=>`<span class="${k<s?'on':''}">${k<s?'✓':''}</span>`).join('')}</div>
      <h2>${s===3?'Превосходно, Жания!':s===2?'Отлично, Жания!':s===1?'Хорошее начало, Жания!':'Давай попробуем ещё раз, Жания'}</h2>
      <p class="muted">С первой попытки: <b>${firstOk} из ${N}</b>. ${s<3?'Пройди ещё раз, чтобы получить все три печати.':`${m.who} благодарит тебя!`}</p>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" style="background:${m.c}" id="again">Пройти ещё раз</button><button class="btn light" id="home">К полкам</button></div></div>`;
    $('#again',el).onclick=()=>startPractice(el,m);$('#home',el).onclick=()=>{location.hash='';renderHome()} };
  draw();
}
const fracIn=()=>`<span class="fin"><input inputmode="numeric" class="fn" autocomplete="off" aria-label="числитель"><span class="bar"></span><input inputmode="numeric" class="fd" autocomplete="off" aria-label="знаменатель"></span>`;

function renderTask(box,t,m,done){
  let tries=0;const fb=()=>$('.fb',box);
  const fail=(given,right)=>{tries++;recordAnswer(m.id,false,{q:t.text,given,right});
    if(tries<2){fb().className='fb bad';fb().innerHTML=pick(RETRY);const b=box.querySelector('.tb');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return}
    fb().className='fb info';fb().innerHTML=`Правильный ответ: <b>${right}</b><br>${t.explain||''}`;lock(false)};
  const win=()=>{recordAnswer(m.id,true);fb().className='fb ok';fb().innerHTML=`<span class="stamp">${pick(STAMPS)}</span><b>${pick(PRAISE)}</b>${t.explain?'<br>'+t.explain:''}${t._note||''}`;lock(tries===0)};
  const lock=first=>{box.querySelectorAll('input,button.choice,.chk,.card').forEach(x=>x.disabled=true);box.dataset.locked='1';
    const nb=document.createElement('button');nb.className='btn';nb.style.background=m.c;nb.style.marginTop='14px';nb.textContent='Следующее задание';nb.onclick=()=>done(first);box.appendChild(nb);nb.focus({preventScroll:false})};
  const enterNav=()=>box.querySelectorAll('input').forEach((inp,k,all)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=[...all].slice(k+1).find(x=>!x.disabled&&!x.value);if(nx&&!inp.closest('.step'))nx.focus();else (inp.closest('.step')?.querySelector('button')||box.querySelector('.chk'))?.click()}}));

  if(t.kind==='frac'||t.kind==='num'||t.kind==='mixed'){
    const inp=t.kind==='frac'?fracIn():t.kind==='mixed'?mixedIn():'<input class="numin nn" inputmode="numeric" autocomplete="off" aria-label="ответ">';
    box.innerHTML=`<div class="tb"><div class="prompt">${t.prompt}</div>${t.visual?`<div style="margin:6px 0">${t.visual}</div>`:''}
      <div class="eq">${t.eq||''} ${inp} <button class="btn chk" style="background:${m.c}">Проверить</button></div>${t.kind==='mixed'?'<div class="muted" style="font-size:15px">Если целой части нет, оставь большую клетку пустой.</div>':''}</div><div class="fb"></div>`;
    setTimeout(()=>box.querySelector('input').focus(),50);
    const check=()=>{
      if(t.kind==='num'){const v=box.querySelector('.nn').value.trim();if(v==='')return;if(+v===t.ans)win();else fail(v,String(t.ans));return}
      const ws=t.kind==='mixed'?box.querySelector('.whole').value.trim():'';const ns=box.querySelector('.fn').value.trim(),ds=box.querySelector('.fd').value.trim();
      const[an,ad]=t.ans;const rightTxt=t.kind==='mixed'?(()=>{const[w,r,b]=toMixed(an,ad);return r?`${w?w+' ':''}${r}/${b}`:`${w}`})():`${an}/${ad}`;
      if(t.kind==='mixed'&&ns===''&&ds===''&&ws!==''){ if(+ws*ad===an)win();else fail(ws,rightTxt);return }
      if(ns===''||ds===''){fb().className='fb info';fb().innerHTML='Заполни и числитель, и знаменатель.';return}
      const w=+ws||0,n=+ns,d=+ds;const given=(ws?ws+' ':'')+`${ns}/${ds}`;if(!(d>0)){fail(given,rightTxt);return}
      const num=w*d+n; if(num*ad!==an*d){fail(given,rightTxt);return}
      if(t.exact&&!(n===an&&d===ad)&&t.kind==='frac'){t._note='';win();return}
      const[sn,sd]=simp(num,d);
      if(t.simplest&&sn!==num){fb().className='fb info';fb().innerHTML='Верно, но дробь ещё можно сократить. Попробуй ещё.';return}
      if(t.kind==='mixed'){ if(n>=d){fb().className='fb info';fb().innerHTML='Значение верное, но дробная часть должна быть меньше 1. Выдели ещё целое.';return}
        t._note=gcd(n,d)>1?`<br>Можно сократить: ${M(w,n,d)} = ${MV(num,d)}`:''; }
      else t._note=(sn!==num?`<br>Можно сократить: ${F(num,d)} = ${F(sn,sd)}`:'')+(num>d&&!t.exact?`<br>Смешанным числом: ${MV(num,d)}`:'');
      win()};
    box.querySelector('.chk').onclick=check;enterNav();
  }
  else if(t.kind==='choice'){
    box.innerHTML=`<div class="tb"><div class="prompt">${t.prompt}</div>${t.eq?`<div class="eq">${t.eq}</div>`:''}
      <div class="choices">${t.options.map((o,k)=>`<button class="choice" data-o="${esc(o)}">${t.labels?t.labels[k]:esc(o)}</button>`).join('')}</div></div><div class="fb"></div>`;
    box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.o===t.correct){b.classList.add('right');win()}else{b.classList.add('wrong');b.disabled=true;fail(b.dataset.o,t.correct)}});
  }
  else if(t.kind==='shade'||t.kind==='multishade'){
    const pies=t.kind==='shade'?1:t.w+1,d=t.d,need=t.kind==='shade'?t.n:t.w*d+t.r;const filled=Array.from({length:pies},()=>Array(d).fill(false));
    box.innerHTML=`<div class="tb"><div class="prompt">${t.prompt}</div><div class="row" id="pw" style="gap:14px"></div>
      <div class="row" style="margin-top:10px"><span class="muted" id="cnt"></span><button class="btn small light" id="clr">Очистить</button><button class="btn chk" style="background:${m.c}">Проверить</button></div></div><div class="fb"></div>`;
    const draw=()=>{$('#pw',box).innerHTML=filled.map((f,p)=>`<div data-p="${p}">${pieSVG(0,d,t.kind==='shade'?200:130,m.c,{filled:f,click:true})}</div>`).join('');
      $('#pw',box).querySelectorAll('[data-p]').forEach(w=>w.querySelectorAll('.hit').forEach(h=>h.onclick=()=>{if(box.dataset.locked)return;const p=+w.dataset.p,k=+h.dataset.i;filled[p][k]=!filled[p][k];draw()}));
      $('#cnt',box).textContent=`Закрашено кусочков: ${filled.flat().filter(Boolean).length}`};
    draw();$('#clr',box).onclick=()=>{filled.forEach(f=>f.fill(false));draw()};
    box.querySelector('.chk').onclick=()=>{const k=filled.flat().filter(Boolean).length;if(k===need)win();else fail(`${k} кусочков`,`${need} кусочков`)};
  }
  else if(t.kind==='line'){
    let sel=null;box.innerHTML=`<div class="tb"><div class="prompt">${t.prompt}</div><div id="lw"></div><div class="row" style="margin-top:6px"><button class="btn chk" style="background:${m.c}" disabled>Проверить</button></div></div><div class="fb"></div>`;
    const draw=()=>{$('#lw',box).innerHTML=lineSVG(t.max,t.d,{click:!box.dataset.locked,marker:sel,color:m.c});$('#lw',box).querySelectorAll('.hit').forEach(h=>h.onclick=()=>{if(box.dataset.locked)return;sel=+h.dataset.i;box.querySelector('.chk').disabled=false;draw()})};
    draw();box.querySelector('.chk').onclick=()=>{if(sel===null)return;const lab=k=>{const[w,r,b]=toMixed(k,t.d);return r?`${w?w+' ':''}${r}/${b}`:`${w}`};
      if(sel===t.target)win();else fail(lab(sel),lab(t.target))};
  }
  else if(t.kind==='pairs'){
    const bases=[];while(bases.length<4){const[a,b]=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[1,6],[5,6]]);if(!bases.some(f=>f[0]*b===a*f[1]))bases.push([a,b])}
    const cards=[];bases.forEach(([a,b],g)=>{const k1=rand(1,2),k2=rand(3,5);cards.push({g,n:a*k1,d:b*k1},{g,n:a*k2,d:b*k2})});
    const order=shuffle(cards);let sel=null,found=0,miss=0;
    box.innerHTML=`<div class="tb"><div class="prompt">Найди пары <b>равных</b> дробей: нажми на две карточки.</div><div class="cards">${order.map((c,k)=>`<button class="card" data-k="${k}">${F(c.n,c.d)}</button>`).join('')}</div></div><div class="fb"></div>`;
    t.explain='Равные дроби получаются друг из друга умножением или делением числителя и знаменателя на одно число.';
    box.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel===null){sel=k;b.classList.add('sel');return}
      if(sel===k){b.classList.remove('sel');sel=null;return}const a=order[sel],c=order[k],prev=box.querySelector(`[data-k="${sel}"]`);
      if(a.n*c.d===c.n*a.d){[prev,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});found++;sel=null;
        if(found===4){if(miss===0)win();else{fb().className='fb info';fb().innerHTML='Все пары найдены. '+t.explain;lock(false)}}}
      else{miss++;recordAnswer(m.id,false,{q:'пары равных дробей',given:`${a.n}/${a.d} и ${c.n}/${c.d}`,right:'не равны'});prev.classList.remove('sel');sel=null;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);
        fb().className='fb bad';fb().innerHTML=`${F(a.n,a.d)} и ${F(c.n,c.d)} не равны. Сократи обе дроби и сравни.`}});
  }
  else if(t.kind==='order'){
    const cols=['#8E3B4E','#4F6D7A','#5E6B3A','#B88A2A','#6E4A63'];const sorted=t.fracs.slice().sort((p,q)=>p[0]*q[1]-q[0]*p[1]);let placed=0,wr=0;
    const L=t.fracs.reduce((a,f)=>lcm(a,f[1]),1);t.explain=`Общий знаменатель ${L}: `+t.fracs.map(f=>`${F(f[0],f[1])} = ${F(f[0]*L/f[1],L)}`).join(', ');
    box.innerHTML=`<div class="tb"><div class="prompt">Нажимай на книги от <b>самой маленькой</b> дроби к <b>самой большой</b>.</div>
      <div class="mini-books">${shuffle(t.fracs).map((f,k)=>`<button class="mbook choice" style="background:${cols[k%5]}" data-v="${f[0]}/${f[1]}">${F(f[0],f[1],'#FBF5EA')}</button>`).join('')}</div>
      <div class="counter">Полка Белль</div><div class="mshelf" id="sh"></div></div><div class="fb"></div>`;
    box.querySelectorAll('.mbook').forEach(b=>b.onclick=()=>{const[n,d]=b.dataset.v.split('/').map(Number),w=sorted[placed];
      if(n===w[0]&&d===w[1]){b.classList.add('used');b.disabled=true;$('#sh',box).insertAdjacentHTML('beforeend',F(n,d));placed++;
        if(placed===sorted.length){if(wr===0)win();else{fb().className='fb info';fb().innerHTML='Полка собрана. '+t.explain;lock(false)}}}
      else{wr++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);recordAnswer(m.id,false,{q:t.text,given:`${n}/${d} слишком рано`,right:sorted.map(f=>f.join('/')).join(' < ')});
        fb().className='fb bad';fb().innerHTML=wr>=2?'Подсказка: '+t.explain:'Эту книгу пока рано ставить. Найди дробь поменьше.'}});
  }
  else if(t.kind==='guided'){
    const{a,b,c,d,plus,L,x,y,r}=t,sign=plus?'+':'−',[sn,sd]=simp(r,L);
    t.explain=`${F(a,b)} ${sign} ${F(c,d)} = ${F(x,L)} ${sign} ${F(y,L)} = ${F(r,L)}${sd!==L?' = '+F(sn,sd):''}`;
    box.innerHTML=`<div class="tb"><div class="prompt">Вычисли по шагам:</div><div class="eq">${F(a,b)} ${sign} ${F(c,d)} = ?</div>
      <div class="step on" id="s1"><h4>Шаг 1. Наименьший общий знаменатель</h4>НОЗ(${b}; ${d}) = <input class="numin" id="i1" inputmode="numeric" aria-label="НОЗ"> <button class="btn small chk" id="c1" style="background:${m.c}">Готово</button></div>
      <div class="step" id="s2"><h4>Шаг 2. Приводим к общему знаменателю</h4><div class="eq" style="font-size:22px">${F(a,b)} = <span class="fin"><input id="i2a" inputmode="numeric" disabled><span class="bar"></span><input disabled class="Lb"></span>
        &nbsp; ${F(c,d)} = <span class="fin"><input id="i2b" inputmode="numeric" disabled><span class="bar"></span><input disabled class="Lb"></span> <button class="btn small chk" id="c2" style="background:${m.c}" disabled>Готово</button></div></div>
      <div class="step" id="s3"><h4>Шаг 3. ${plus?'Складываем':'Вычитаем'} и сокращаем</h4><div class="eq" style="font-size:22px"><span id="mid"></span> = ${fracIn()} <button class="btn small chk" id="c3" style="background:${m.c}" disabled>Готово</button></div></div></div><div class="fb"></div>`;
    box.querySelectorAll('#s3 .fin input').forEach(z=>z.disabled=true);
    let mist=0,sf=0;const sfail=(g,rt,h)=>{mist++;sf++;recordAnswer(m.id,false,{q:t.text,given:g,right:rt});if(sf>=2){fb().className='fb info';fb().innerHTML='Подсказка: '+h}else{fb().className='fb bad';fb().innerHTML=pick(RETRY)}};
    const ok=()=>{sf=0;fb().className='fb ok';fb().innerHTML='Верно. Следующий шаг.'};const i1=$('#i1',box);setTimeout(()=>i1.focus(),50);
    $('#c1',box).onclick=()=>{const v=+i1.value;if(v===L){ok();$('#s1',box).className='step done';i1.disabled=true;$('#c1',box).disabled=true;$('#s2',box).className='step on';box.querySelectorAll('.Lb').forEach(q=>q.value=L);['#i2a','#i2b','#c2'].forEach(s=>$(s,box).disabled=false);$('#i2a',box).focus()}
      else if(v>0&&v%b===0&&v%d===0){fb().className='fb info';fb().innerHTML=`${v} — общий знаменатель, но не наименьший. Найди меньше.`}
      else sfail(i1.value,String(L),`перебирай числа, кратные ${Math.max(b,d)}: ${Math.max(b,d)}, ${2*Math.max(b,d)}, ${3*Math.max(b,d)}… Какое из них делится на ${Math.min(b,d)}?`)};
    $('#c2',box).onclick=()=>{const p=+$('#i2a',box).value,q=+$('#i2b',box).value;if(p===x&&q===y){ok();$('#s2',box).className='step done';['#i2a','#i2b','#c2'].forEach(s=>$(s,box).disabled=true);$('#s3',box).className='step on';$('#mid',box).innerHTML=`${F(x,L)} ${sign} ${F(y,L)}`;$('#c3',box).disabled=false;box.querySelectorAll('#s3 .fin input').forEach(z=>z.disabled=false);$('#s3 .fn',box).focus()}
      else sfail(`${p} и ${q}`,`${x} и ${y}`,`множители ${L} : ${b} = ${L/b} и ${L} : ${d} = ${L/d}. Умножь числители: ${a} · ${L/b} и ${c} · ${L/d}`)};
    $('#c3',box).onclick=()=>{const n=+$('#s3 .fn',box).value,dd=+$('#s3 .fd',box).value;if(dd>0&&n*L===r*dd){$('#s3',box).className='step done';const[p,q]=simp(n,dd);t._note=p!==n?`<br>Можно сократить: ${F(n,dd)} = ${F(p,q)}`:'';tries=mist>0?1:0;win()}
      else sfail(`${n}/${dd}`,`${r}/${L}`,`${x} ${sign} ${y} = ${r}, знаменатель ${L} не меняется`)};
    box.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.closest('.step').querySelector('button')?.click()}));
  }
}

/* ---------- speed: Merida's tournament ---------- */
function startSpeed(el,m){
  let score=0,left=60,arrows=[];
  el.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div><div class="timer" id="tm">60</div><div class="muted">секунд</div></div>
     <div id="target"></div><div style="text-align:right"><div class="timer" id="sc">0</div><div class="muted">попаданий · рекорд ${bestBall()}</div></div></div><div id="bq" style="margin-top:10px"></div>`;
  const drawTarget=()=>{let s=`<svg width="150" height="150" viewBox="0 0 150 150">`;[[70,'#FBF5EA'],[56,'#4F6D7A'],[42,'#FBF5EA'],[28,'#8E3B4E'],[14,'#B88A2A']].forEach(([r,c])=>s+=`<circle cx="75" cy="75" r="${r}" fill="${c}" stroke="#4A2E1F" stroke-width="2"/>`);
    arrows.forEach(([x,y],k)=>s+=`<g ${k===arrows.length-1?'class="pop"':''}><line x1="${x}" y1="${y}" x2="${x+16}" y2="${y-16}" stroke="#4A2E1F" stroke-width="3"/><circle cx="${x}" cy="${y}" r="4" fill="#4A2E1F"/><path d="M${x+14} ${y-20} l6 0 l0 -6 M${x+18} ${y-14} l6 0 l0 -6" stroke="#8E3B4E" stroke-width="2.5" fill="none"/></g>`);
    $('#target',el).innerHTML=s+'</svg>'};drawTarget();
  const next=()=>{const bq=$('#bq',el);const r=Math.random();let t;
    if(r<.35){t=GEN.cmp(rand(0,8));if(t.options.length!==3)t=GEN.cmp(1);
      bq.innerHTML=`<div class="eq">${t.eq}</div><div class="choices">${t.options.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div>`;
      bq.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.o===t.correct,t.text,b.dataset.o,t.correct));return}
    t=r<.7?GEN.same(rand(0,2)):GEN.mul(0);if(t.kind==='num')t=GEN.same(0);
    bq.innerHTML=`<div class="eq">${t.eq} ${fracIn()} <button class="btn" id="ok" style="background:${m.c}">Ответ</button></div>`;
    const go=()=>{const n=+bq.querySelector('.fn').value,d=+bq.querySelector('.fd').value;answer(d>0&&n*t.ans[1]===t.ans[0]*d,t.text,`${n}/${d}`,`${t.ans[0]}/${t.ans[1]}`)};
    $('#ok',bq).onclick=go;const ins=bq.querySelectorAll('input');ins[0].focus();ins.forEach((inp,k)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){if(k===0)ins[1].focus();else go()}}))};
  const answer=(ok,q,g,rt)=>{if(left<=0)return;recordAnswer('speed',ok,ok?null:{q,given:g,right:rt});
    if(ok){score++;$('#sc',el).textContent=score;const a=Math.random()*Math.PI*2,rr=Math.random()*40;arrows.push([75+rr*Math.cos(a),75+rr*Math.sin(a)]);drawTarget()}
    else{$('#bq',el).classList.add('shake');setTimeout(()=>$('#bq',el)?.classList.remove('shake'),350)} next()};
  const timer=setInterval(()=>{if(currentModule!=='speed'||!document.body.contains(el)){clearInterval(timer);return}left--;const tm=$('#tm',el);if(tm)tm.textContent=left;if(left<=0){clearInterval(timer);end()}},1000);
  const end=()=>{const rec=score>bestBall();if(score>(local.best.speed||0)){local.best.speed=score;saveLocal()}if(score>session.ballBest)session.ballBest=score;dirty=true;saveNow();updateHeader();if(rec&&score>0)burst();
    el.innerHTML=`<div class="result"><h2>Турнир окончен</h2><p style="font-size:24px"><b>${score}</b> ${score%10===1&&score%100!==11?'стрела':(score%10>=2&&score%10<=4&&(score%100<10||score%100>=20))?'стрелы':'стрел'} в мишени</p>${rec?'<p><b>Новый рекорд!</b></p>':''}
      <div class="row" style="justify-content:center"><button class="btn" style="background:${m.c}" id="again">Ещё раз</button><button class="btn light" id="home">К полкам</button></div></div>`;
    $('#again',el).onclick=()=>startSpeed(el,m);$('#home',el).onclick=()=>{location.hash='';renderHome()}};
  next();
}
function burst(){const cols=['#8E3B4E','#B88A2A','#5E6B3A','#4F6D7A','#6E4A63'];for(let i=0;i<36;i++){const s=document.createElement('div');s.className='particle';s.style.background=pick(cols);s.style.left=Math.random()*100+'vw';s.style.top='-12px';
  if(Math.random()<.4)s.style.borderRadius='50%';s.style.animationDuration=(1.8+Math.random()*1.6)+'s';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}}

/* ---------- report ---------- */

  const tot=ss.reduce((a,s)=>a+(s.activeSec||0),0),cor=ss.reduce((a,s)=>a+(s.correct||0),0),wr=ss.reduce((a,s)=>a+(s.wrong||0),0),acc=cor+wr?Math.round(cor/(cor+wr)*100):0;
  const days=[];for(let k=6;k>=0;k--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);days.push({t:d.getTime(),sec:0,lab:d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric'})})}

       :`<p class="note">Сейчас показаны данные только с этого устройства. Чтобы видеть прогресс с любого устройства, Жания должна открывать сайт под вашим аккаунтом Claude.</p>`}
    <div class="kpis"><div class="kpi"><div class="v">${fmtDur(tot)}</div><div class="l">всего времени</div></div><div class="kpi"><div class="v">${fmtDur(todaySec())}</div><div class="l">сегодня</div></div>
      <div class="kpi"><div class="v">${ss.filter(s=>s.activeSec>=60).length}</div><div class="l">занятий длиннее минуты</div></div><div class="kpi"><div class="v">${acc}%</div><div class="l">верных ответов (${cor} из ${cor+wr})</div></div>
      <div class="kpi"><div class="v">${totalStars()} из 33</div><div class="l">печатей</div></div><div class="kpi"><div class="v" style="font-size:22px">${ss[0]?fmtDT(ss[0].lastAt):'—'}</div><div class="l">последняя активность</div></div></div>
    ${weak?`<p class="note">Больше всего ошибок в теме «${weak.m.title}» — ${Math.round(weak.w/(weak.c+weak.w)*100)}% неверных попыток.</p>`:''}
    <h3>Минуты занятий за неделю</h3><div class="chart">${days.map(d=>{const mn=Math.round(d.sec/60);return`<div class="col"><div class="tip">${d.lab}: ${fmtDur(d.sec)}</div>${mn?`<div class="val">${mn}</div>`:''}<div class="b" style="height:${mn/maxMin*85}%"></div></div>`}).join('')}</div>
    <div class="xl">${days.map(d=>`<div>${d.lab}</div>`).join('')}</div>

      ${ss.slice(0,15).map(s=>`<tr><td>${fmtDT(s.startedAt)}</td><td>${fmtDur(s.activeSec)}</td><td>${s.correct||0}</td><td>${s.wrong||0}</td><td>${Object.keys(s.modules||{}).filter(k=>MOD[k]&&s.modules[k].sec>5).map(k=>MOD[k].title).join(', ')||'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Занятий пока не было</td></tr>'}</tbody></table></div>
    <h3>Над чем поработать</h3><div style="overflow-x:auto"><table><thead><tr><th>Когда</th><th>Тема</th><th>Задание</th><th>Ответ Жании</th><th>Верно</th></tr></thead><tbody>
      ${mistakes.slice(0,15).map(x=>`<tr><td>${fmtDT(x.t)}</td><td>${MOD[x.m]?MOD[x.m].title:''}</td><td>${esc(x.q||'')}</td><td style="color:var(--bad-ink);font-weight:700">${esc(x.given||'')}</td><td style="font-weight:700">${esc(x.right||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Ошибок пока нет</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="cp">Скопировать отчёт текстом</button><span id="cpm" class="muted"></span></div></article>`;
  $('#bk',app).onclick=()=>{location.hash='';renderHome()};
  $('#cp',app).onclick=async()=>{const txt=[`Отчёт: Жания, дроби (${new Date().toLocaleDateString('ru-RU')})`,`Всего времени: ${fmtDur(tot)}; сегодня: ${fmtDur(todaySec())}`,`Верных ответов: ${acc}% (${cor} из ${cor+wr}); печатей: ${totalStars()} из 33`,
    'По темам:',...mods.filter(x=>x.sec||x.c||x.w).map(({m,sec,c,w})=>`- ${m.title}: ${fmtDur(sec)}, верно ${c}, ошибок ${w}`),'Последние ошибки:',...mistakes.slice(0,8).map(x=>`- ${x.q}: ответ ${x.given}, верно ${x.right}`)].join('\n');
    try{await navigator.clipboard.writeText(txt);$('#cpm',app).textContent='Скопировано'}catch(e){$('#cpm',app).textContent='Не удалось скопировать'}};
}

if(location.hash==='#report')renderReport();else renderHome();
</script>
</body>
</html>
